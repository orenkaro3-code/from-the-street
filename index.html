<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>מהרחוב למשמרת</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&family=Secular+One&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
/* Layout: full-bleed 3D game stage with HUD layers (objective, phone, nav app, dialog, computer). Single dark UI look by design. */
:root{
  --ink:#0b141c; --panel:#13222f; --panel2:#182b3a; --line:#26405a; --text:#eef3f6; --muted:#90a7b8;
  --amber:#f6b43a; --red:#ff5a4c; --teal:#4fd1bd; --nav:#33c3ff; --good:#5bd38c; --orange:#ff9a3c;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#game{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;pointer-events:none}
/* top bar */
#top{top:10px;inset-inline:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.chip{background:rgba(11,20,28,.82);border:1px solid var(--line);border-radius:10px;padding:6px 11px;display:flex;flex-direction:column;gap:1px;backdrop-filter:blur(4px)}
.chip .k{font-size:10.5px;color:var(--muted);letter-spacing:.5px}
.chip .v{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
#obj{flex:1 1 260px;min-width:0;max-width:520px;flex-direction:row;align-items:center;gap:10px}
#obj .txt{display:flex;flex-direction:column;min-width:0}
#obj .k{color:var(--amber)}
#obj .v{font-family:var(--f-body);font-weight:700;font-size:15px;white-space:normal}
#compass{width:30px;height:30px;flex:none;transition:transform .12s linear}
#phoneBtn{pointer-events:auto;cursor:pointer;position:relative;border-radius:10px;padding:8px 12px;background:rgba(11,20,28,.82);border:1px solid var(--line);font-weight:700;font-size:14px}
#phoneBtn .dot{position:absolute;top:-4px;inset-inline-start:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);font-size:11px;display:grid;place-items:center;padding:0 4px}
/* notification & phone */
#notif{top:70px;inset-inline-start:12px;width:min(330px,calc(100% - 24px));background:#f4f6f8;color:#111;border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  transform:translateY(-20px);opacity:0;transition:transform .3s,opacity .3s;display:flex;gap:10px;align-items:flex-start}
#notif.on{transform:none;opacity:1}
.av{width:36px;height:36px;border-radius:50%;background:#2b6cb0;color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
#notif b{display:block;font-size:13px}#notif p{margin:2px 0 0;font-size:13.5px;line-height:1.35}
#phone{top:64px;inset-inline-start:12px;width:min(320px,calc(100% - 24px));height:min(480px,70%);background:#0f1418;border:6px solid #202830;border-radius:26px;pointer-events:auto;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#phone header{background:#1f6f5c;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
#phone header button{margin-inline-start:auto;background:none;border:0;font-size:20px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;background:#0d1a17}
.msg{max-width:88%;background:#1f2c34;border-radius:10px;padding:7px 10px;font-size:13.5px;line-height:1.4;align-self:flex-start}
.msg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px;font-weight:700}
.msg time{display:block;text-align:start;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:3px}
/* prompt */
#prompt{bottom:150px;left:50%;transform:translateX(-50%);background:rgba(11,20,28,.88);border:1px solid var(--amber);border-radius:10px;padding:8px 14px;font-weight:700;display:flex;gap:10px;align-items:center;white-space:nowrap}
#prompt kbd{font-family:var(--f-mono);background:var(--amber);color:#1b1306;border-radius:5px;padding:1px 7px;font-size:13px}
#holdbar{width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}#holdbar i{display:block;height:100%;width:0;background:var(--amber)}
/* nav app */
#nav{top:62px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:flex;flex-direction:column;gap:0;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#nav .main{background:#1a8fd6;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px}
#nav .main svg{flex:none}
#nav .dist{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1}
#nav .st{font-size:15px;font-weight:700}
#nav .sub{background:#0f2433;display:flex;justify-content:space-between;padding:6px 14px;font-size:13px;color:#cfe7f7}
#nav .sub b{font-family:var(--f-mono)}
#nav .brandn{font-weight:800;color:var(--nav);letter-spacing:.4px}
#mini{bottom:16px;inset-inline-end:16px;width:150px;height:150px;border-radius:50%;border:3px solid #1a8fd6;background:#0e1b25;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#speedo{bottom:176px;inset-inline-end:16px;width:170px;text-align:center;font-family:var(--f-mono);display:flex;flex-direction:column;gap:6px;align-items:center}
.limrow{display:flex;gap:10px;align-items:center;justify-content:center}.limsign{width:54px;height:54px;border-radius:50%;background:#fff;border:6px solid #dc2626;color:#111;font:800 21px var(--f-mono);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.4);transition:transform .25s}.limsign.pop{transform:scale(1.25)}.limsign.over{animation:limflash .5s infinite}@keyframes limflash{50%{background:#fecaca}}
.limbtn{pointer-events:auto;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:rgba(11,20,28,.85);color:var(--muted);font:700 12px var(--f-body);padding:5px 10px}.limbtn.on{border-color:#22c55e;color:#bbf7d0}
#speedo b{font-size:30px;display:block;line-height:1;text-shadow:0 2px 6px #000}#speedo span{font-size:11px;color:var(--muted)}
/* dialog */
#dialog{bottom:16px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));background:rgba(12,22,31,.95);border:1px solid var(--line);border-radius:14px;padding:14px 18px 12px;pointer-events:auto;
  display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#dialog .who{font-weight:800;color:var(--amber);font-size:14px;letter-spacing:.3px}
#dialog .who.narr{color:var(--muted);font-weight:600}
#dialog .line{font-size:17px;line-height:1.55;min-height:2.6em}
#dialog .line.narr{font-style:italic;color:#cbd8e2}
#dialog .ch{display:flex;flex-direction:column;gap:6px}
.opt{text-align:start;padding:9px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:15px;font-weight:600}
.opt:hover{border-color:var(--amber)}
#dialog .cont{align-self:flex-end;font-size:12px;color:var(--muted)}
/* touch */
#joy{bottom:24px;left:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.35)}
#act{bottom:40px;right:28px;width:84px;height:84px;border-radius:50%;background:rgba(246,180,58,.25);border:2px solid var(--amber);pointer-events:auto;touch-action:none;font-weight:800;font-size:15px;color:#ffe4ad}
#run{bottom:140px;right:40px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none;font-size:12px;font-weight:700}
#run.on{background:rgba(79,209,189,.35);border-color:var(--teal)}
/* overlays */
.full{position:absolute;inset:0;z-index:30}
#fade{background:#000;opacity:0;transition:opacity .45s;pointer-events:none;z-index:29}
#ov{z-index:32}#pc{z-index:31}#dialog{z-index:33}#notif{z-index:34}
#fade.on{opacity:1}
#flash{background:#c0221a;opacity:0;pointer-events:none;transition:opacity .5s}
.overlay{display:grid;place-items:center;background:rgba(5,10,15,.78);backdrop-filter:blur(4px);overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:1.4px;color:var(--amber);font-weight:700}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0;line-height:1.1;text-wrap:balance}
.sheet p{margin:0;color:#c3d1dc;line-height:1.6;font-size:16px}
.btn{padding:11px 16px;border-radius:10px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);font-size:15px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:#1b1306;border-color:var(--amber);font-size:17px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;color:var(--muted)}
.keys kbd{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--text);font-size:12.5px;justify-self:start}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{background:var(--panel2);border-radius:9px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.stats .k{font-size:12px;color:var(--muted)}.stats .v{font-family:var(--f-mono);font-size:20px}
.title-h{font-family:var(--f-display);font-size:52px;line-height:1;margin:0;font-weight:400}
.title-h em{font-style:normal;color:var(--amber)}
/* elevator */
.floors{display:flex;flex-direction:column;gap:7px}
.floor{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:start;padding:9px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:15px}
.floor b{font-family:var(--f-mono);font-size:18px;width:36px;height:36px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.floor:hover b,.floor.here b{border-color:var(--amber);color:var(--amber)}
.floor span small{display:block;color:var(--muted);font-size:12.5px}
/* computer */
#pc{background:#05090d;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex}
.win{flex:1;min-width:0;display:flex;flex-direction:column;background:#eef2f5;color:#16212b;border-radius:10px;overflow:hidden;border:2px solid #2a3c4c}
.win .bar{background:#13406b;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 14px}
.win .bar h3{margin:0;font-size:16px;font-weight:800;margin-inline-end:auto}
.win .bar .m{font-family:var(--f-mono);font-size:13px;opacity:.9}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;padding:10px;overflow:auto}
.col{display:flex;flex-direction:column;gap:7px;min-width:0}
.col h4{margin:0;font-size:12px;letter-spacing:1px;color:#4a6175}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:#fff;border:2px solid #d5dee6;border-radius:9px;padding:8px 10px;cursor:pointer;text-align:start;width:100%;color:#16212b}
.tk:hover{border-color:#7aa7cf}.tk.sel{border-color:#1a8fd6;background:#eaf5fd}
.tk .u{grid-row:span 2;font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px;color:#fff;background:#6d8496}
.tk .u.h{background:#e07b13}.tk .u.e{background:#d12d22}
.tk .t1{font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .t2{font-size:12.5px;color:#4a6175;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .w{font-family:var(--f-mono);font-size:12px;color:#4a6175;grid-row:span 2}
.tk .w.late{color:#d12d22;font-weight:700}
.te{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;background:#fff;border:2px solid #d5dee6;border-radius:9px;padding:8px 10px;text-align:start;width:100%;color:#16212b;cursor:pointer}
.te:disabled{opacity:.55;cursor:not-allowed}
.te:not(:disabled):hover{border-color:#1a8fd6}
.te .n{font-weight:800;font-size:14px}.te .s{font-size:12px;color:#4a6175}
.te .tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:#e3eaf0;color:#33485a}
.te .tag.ok{background:#d6f3e2;color:#17683b}.te .tag.no{background:#fde2df;color:#a52519}
.te .mt{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.te .pb{grid-column:1/-1;height:4px;background:#e3eaf0;border-radius:2px;overflow:hidden}.te .pb i{display:block;height:100%;background:#1a8fd6}
.emp{font-size:13px;color:#6d8496;padding:6px 2px}
.plog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#33485a}
.plog li{display:flex;gap:6px}.plog .st{color:#e0a10f;letter-spacing:1px}
.hintp{font-size:12.5px;color:#4a6175;background:#e3eaf0;border-radius:8px;padding:7px 10px;line-height:1.45}
/* camera button */
#camBtn{top:120px;inset-inline-end:16px;pointer-events:auto;cursor:pointer;background:rgba(11,20,28,.82);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
/* phone apps */
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:16px 12px;background:linear-gradient(160deg,#1b3550,#0d1a26)}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;font-size:12px;font-weight:600}
.app i{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:800;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;background:#0d1a26;font-size:13.5px}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#16283a;border-radius:9px;padding:9px 11px}
.prow b{font-family:var(--f-mono)}
.pbtn{background:#1a8fd6;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;font-size:13px}
.pbtn.alt{background:#2c3e50}.pbtn:disabled{opacity:.45;cursor:not-allowed}
.card3d{border-radius:12px;padding:14px;background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;font-family:var(--f-mono);display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.card3d .num{font-size:15px;letter-spacing:2px}
/* shop */
.items{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item b{font-size:15px}.item small{grid-column:1;color:var(--muted);font-size:12.5px}
.item .pr{font-family:var(--f-mono);font-size:15px;color:var(--amber);grid-row:span 2;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.item .pr button{font-size:12px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:#20354a;cursor:pointer;font-weight:700}
.item .pr button:disabled{opacity:.4;cursor:not-allowed}
/* call center OS */
.os{flex:1;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#0a1626;color:#dce8f3;border-radius:12px;overflow:hidden;border:2px solid #1f3550}
.os .banner{background:linear-gradient(90deg,#f6b43a,#ffd27a);color:#2a1a00;font-weight:800;text-align:center;padding:5px 10px;font-size:13.5px}
.os .main{display:grid;grid-template-columns:86px minmax(0,1fr);min-height:0}
.rail{display:flex;flex-direction:column;gap:12px;padding:12px 6px;background:#0d1d31;border-inline-end:1px solid #1f3550;align-items:center;overflow-y:auto}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;font-size:11px;font-weight:600;color:#b8cadb}
.rail button i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;font-size:16px}
.rail button.on{color:#fff}.rail button.on i{outline:2px solid #fff;outline-offset:2px}
.pane{min-width:0;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.callgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;min-height:0}
.box{background:#102238;border:1px solid #1f3a58;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h5{margin:0;font-size:12px;letter-spacing:.8px;color:#7fa3c4}
.cust{display:flex;gap:10px;align-items:center}
.cust .ava{width:52px;height:52px;border-radius:50%;background:#1d4ed8;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.mood{height:6px;border-radius:3px;background:#1f3550;overflow:hidden}.mood i{display:block;height:100%}
.tr{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow-y:auto;padding-inline-end:4px}
.bub{max-width:86%;padding:7px 10px;border-radius:10px;font-size:14px;line-height:1.45}
.bub.c{align-self:flex-start;background:#1c3350}.bub.me{align-self:flex-end;background:#0f5c4f}.bub.sys{align-self:center;background:transparent;color:#f6b43a;font-size:12.5px;font-weight:700}
.qr{display:flex;flex-wrap:wrap;gap:6px}
.qr button{background:#18304c;border:1px solid #2b4a6e;border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer;color:#dce8f3;text-align:start}

<script>
(()=>{
const $=s=>document.querySelector(s);
if(!window.THREE){$('#ov').hidden=false;$('#sheet').innerHTML='<p>טעינת מנוע התלת מימד נכשלה. רענן את הדף.</p>';return}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
const V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>'₪'+Math.round(n).toLocaleString('en-US');

/* =============== RENDERER =============== */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const camera=new THREE.PerspectiveCamera(55,1,.2,700);
function castAll(o){o.traverse(m=>{if(m.isMesh&&!(m.material&&m.material.transparent)){m.castShadow=true}})}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(canvas);

/* =============== TEXTURES =============== */
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const glowTex=ctex(64,64,g=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
const blobTex=ctex(64,64,g=>{const r=g.createRadialGradient(32,32,3,32,32,32);r.addColorStop(0,'rgba(0,0,0,.6)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
let facadeTex,litTex;
function makeFacades(){
  facadeTex=ctex(128,256,(g,w,h)=>{g.fillStyle='#c9ccc8';g.fillRect(0,0,w,h);for(let y=8;y<h-6;y+=16)for(let x=8;x<w-8;x+=20){g.fillStyle='#3d5468';g.fillRect(x,y,12,10);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x,y,12,3)}});
  litTex=ctex(128,256,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);for(let y=8;y<h-6;y+=16)for(let x=8;x<w-8;x+=20){const r=Math.random();if(r<.5){g.fillStyle=r<.1?'#fff1c8':'#ffc66e';g.fillRect(x,y,12,10)}}});
  facadeTex.wrapS=facadeTex.wrapT=litTex.wrapS=litTex.wrapT=THREE.RepeatWrapping;
  const noise=(g,w,h,base,amp,n)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){const v=Math.random()*amp-amp/2;g.fillStyle=v>0?`rgba(255,255,255,${v/255})`:`rgba(0,0,0,${-v/255})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}};
  asphaltTex=ctex(256,256,(g,w,h)=>{noise(g,w,h,'#5a5d61',70,9000);g.strokeStyle='rgba(20,20,20,.35)';g.lineWidth=1.5;for(let i=0;i<5;i++){g.beginPath();let x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);for(let k=0;k<6;k++){x+=rand(-25,25);y+=rand(-25,25);g.lineTo(x,y)}g.stroke()}
    for(let i=0;i<4;i++){g.fillStyle='rgba(30,30,32,.25)';g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,rand(10,40),rand(6,20),Math.random()*3,0,7);g.fill()}});
  tileTex=ctex(128,128,(g,w,h)=>{noise(g,w,h,'#c9c4ba',40,2500);g.strokeStyle='rgba(60,55,50,.45)';g.lineWidth=2;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*32,0);g.lineTo(i*32,h);g.stroke();g.beginPath();g.moveTo(0,i*32);g.lineTo(w,i*32);g.stroke()}});
  concreteTex=ctex(128,128,(g,w,h)=>noise(g,w,h,'#777b7f',50,3000));
  carpetTex=ctex(128,128,(g,w,h)=>{for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle=(x+y)%2?'#2b3446':'#323c50';g.fillRect(x*32,y*32,32,32)}noise(g,0,0,'#000',0,0);for(let i=0;i<3000;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.05})`;g.fillRect(Math.random()*w,Math.random()*h,1,1)}});
  woodTex=ctex(128,128,(g,w,h)=>{for(let y=0;y<h;y+=16){g.fillStyle=`hsl(28,${35+Math.random()*10}%,${34+Math.random()*8}%)`;g.fillRect(0,y,w,16);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,y,w,1)}for(let i=0;i<600;i++){g.fillStyle='rgba(0,0,0,.06)';g.fillRect(Math.random()*w,Math.random()*h,8,1)}});
  [asphaltTex,tileTex,concreteTex,carpetTex,woodTex].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping});
}
let asphaltTex,tileTex,concreteTex,carpetTex,woodTex;
function signTex(lines,o={}){const w=o.w||512,h=o.h||256;return ctex(w,h,(g)=>{g.fillStyle=o.bg||'#123a5a';g.fillRect(0,0,w,h);if(o.border){g.strokeStyle=o.border;g.lineWidth=10;g.strokeRect(5,5,w-10,h-10)}
  g.direction='rtl';g.textAlign='center';g.fillStyle=o.fg||'#fff';const size=o.size||64;const lh=size*1.2;const y0=h/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{const s=i===0?size:size*.62;g.font=`800 ${s}px Assistant, sans-serif`;g.fillStyle=i===0?(o.fg||'#fff'):(o.sub||'#cfe3f2');g.fillText(l,w/2,y0+i*lh+s*.35)})})}
function sign(lines,w,h,o){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:signTex(lines,o)}));return m}

/* =============== MODELS =============== */
const matCache={};
function M(c,o={}){const k=c+JSON.stringify(o);if(!matCache[k])matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));return matCache[k]}
function box(w,h,d,c,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c&&c.isMaterial?c:M(c,o));return m}
function glow(color,scale,op){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op??.8,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.setScalar(scale);return s}
function blob(r){const m=new THREE.Mesh(new THREE.PlaneGeometry(r,r),new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=.03;return m}

const OUTFITS={
 homeless:{shirt:0x5a4632,pants:0x3b3a36,coat:0x4a3a2a,hair:0x2d2620,beard:0x3a3129,skin:0xc9956b,shoes:0x2a2420},
 worker:{shirt:0x3a4a5a,pants:0x2e3b4a,vest:0xff7a1a,hair:0x2d2620,beard:0x3a3129,skin:0xc9956b,shoes:0x2a2420},
 office:{shirt:0x5b8fc7,pants:0x2c3540,hair:0x2d2620,skin:0xc9956b,badge:1,shoes:0x1b1b1b},
};
function human(o){
  const g=new THREE.Group();const inner=new THREE.Group();g.add(inner);
  const skin=M(o.skin||0xc9956b);
  const mkLimb=(w,h,d,c,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=box(w,h,d,c);m.position.y=-h/2;p.add(m);inner.add(p);return p};
  const legL=mkLimb(.22,.82,.24,o.pants||0x333333,-.14,.86),legR=mkLimb(.22,.82,.24,o.pants||0x333333,.14,.86);
  [legL,legR].forEach(l=>{const s=box(.24,.1,.34,o.shoes||0x222222);s.position.set(0,-.82,.05);l.add(s)});
  const torso=box(.6,.72,.32,o.coat||o.shirt||0x777777);torso.position.y=1.22;inner.add(torso);
  if(o.vest){const v=box(.63,.6,.35,o.vest);v.position.y=1.2;inner.add(v);const s1=box(.64,.06,.36,0xe8f0d0,{emissive:0x444433});s1.position.y=1.1;inner.add(s1);const s2=s1.clone();s2.position.y=1.3;inner.add(s2)}
  if(o.badge){const b=box(.12,.16,.02,0xffffff);b.position.set(.15,1.3,.17);inner.add(b)}
  if(o.apron){const a=box(.5,.7,.02,0xe8e2d0);a.position.set(0,1.05,.17);inner.add(a)}
  const armL=mkLimb(.16,.64,.18,o.coat||o.shirt||0x777777,-.39,1.54),armR=mkLimb(.16,.64,.18,o.coat||o.shirt||0x777777,.39,1.54);
  [armL,armR].forEach(a=>{const h=box(.14,.14,.14,skin);h.position.y=-.68;a.add(h)});
  const head=new THREE.Mesh(new THREE.SphereGeometry(.21,14,10),skin);head.position.y=1.8;inner.add(head);
  if(o.hood){const hd=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8,0,Math.PI*2,0,Math.PI*.62),M(o.hood));hd.position.y=1.82;hd.rotation.x=-.25;inner.add(hd)}
  else if(o.helmet){const hm=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8,0,Math.PI*2,0,Math.PI/2),M(o.helmet));hm.position.y=1.86;inner.add(hm);const br=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.03,16),M(o.helmet));br.position.y=1.86;inner.add(br)}
  else if(o.cap){const cp=new THREE.Mesh(new THREE.CylinderGeometry(.22,.23,.12,14),M(o.cap));cp.position.y=1.96;inner.add(cp);const v=box(.24,.03,.16,o.cap);v.position.set(0,1.92,.2);inner.add(v)}
  else{const hair=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8,0,Math.PI*2,0,Math.PI*.45),M(o.hair||0x2b2118));hair.position.y=1.83;inner.add(hair)}
  if(o.beard){const b=box(.3,.16,.12,o.beard);b.position.set(0,1.67,.13);inner.add(b)}
  if(o.headset){const hs=new THREE.Mesh(new THREE.TorusGeometry(.23,.025,6,16,Math.PI),M(0x222222));hs.position.y=1.82;inner.add(hs);const mic=box(.04,.04,.2,0x222222);mic.position.set(-.2,1.72,.1);inner.add(mic)}
  if(o.glasses){const gl=box(.3,.06,.03,0x111111);gl.position.set(0,1.83,.19);inner.add(gl)}
  castAll(inner);g.add(blob(1.3));
  return{g,inner,legL,legR,armL,armR,torso,phase:0}
}
function animHuman(h,speed,dt){
  if(h.sit){h.legL.rotation.x=h.legR.rotation.x=-1.45;h.inner.position.y=-.42;h.armL.rotation.x=h.armR.rotation.x=-.9;return}
  h.inner.position.y=0;
  if(speed>.1){h.phase+=dt*speed*2.2;const a=Math.min(.75,.3+speed*.07);h.legL.rotation.x=Math.sin(h.phase)*a;h.legR.rotation.x=-Math.sin(h.phase)*a;h.armL.rotation.x=-Math.sin(h.phase)*a*.8;h.armR.rotation.x=Math.sin(h.phase)*a*.8;h.inner.position.y=Math.abs(Math.cos(h.phase))*.04}

const LANE=3.2,TRAFFIC=[];
function spawnTraffic(n){
  const adj=[];NODES.forEach((_,i)=>adj[i]=[]);SEGS.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});OUT.adj=adj;
  for(let i=0;i<n;i++){const s=pick(SEGS);const fwd=Math.random()<.5;const a=fwd?s[0]:s[1],b=fwd?s[1]:s[0];const c=pick(CARCOL);
    const v=vehicle(Math.random()<.15?'van':'car',null,{body:c,stripe:Math.random()<.2?0xffffff:c});const A=NODES[a],B=NODES[b];const L=Math.hypot(B.x-A.x,B.z-A.z);const fx=(B.x-A.x)/L,fz=(B.z-A.z)/L;const t=rand(.25,.75);
    v.x=A.x+fx*L*t-fz*LANE;v.z=A.z+fz*L*t+fx*LANE;v.yaw=Math.atan2(fx,fz);v.ai={a,b,cruise:rand(8,12.5),stuck:0,ghost:0};v.g.position.set(v.x,0,v.z);v.g.rotation.y=v.yaw;OUT.s.add(v.g);OUT.cars.push(v);TRAFFIC.push(v)}
}
function updateTraffic(dt){
  for(const v of TRAFFIC){const ai=v.ai;let A=NODES[ai.a],B=NODES[ai.b];let L=Math.hypot(B.x-A.x,B.z-A.z),fx=(B.x-A.x)/L,fz=(B.z-A.z)/L;let s=(v.x-A.x)*fx+(v.z-A.z)*fz;
    if(s>L-LANE-2.5){const opts=OUT.adj[ai.b].filter(n=>n!==ai.a);const nx=opts.length?pick(opts):ai.a;ai.a=ai.b;ai.b=nx;A=NODES[ai.a];B=NODES[ai.b];L=Math.hypot(B.x-A.x,B.z-A.z);fx=(B.x-A.x)/L;fz=(B.z-A.z)/L;s=(v.x-A.x)*fx+(v.z-A.z)*fz}
    const look=Math.max(0,s)+6.5;const tx=A.x+fx*look-fz*LANE,tz=A.z+fz*look+fx*LANE;
    let dy=Math.atan2(tx-v.x,tz-v.z)-v.yaw;while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;v.yaw+=dy*Math.min(1,dt*3.2);
    let target=Math.abs(dy)>.45?5:ai.cruise;const sy=Math.sin(v.yaw),cy=Math.cos(v.yaw);
    if(ai.ghost>0)ai.ghost-=dt;else{
      for(const o of OUT.cars){if(o===v)continue;const rx=o.x-v.x,rz=o.z-v.z;const ah=rx*sy+rz*cy;if(ah<.5||ah>12)continue;const lat=Math.abs(rx*cy-rz*sy);if(lat<2.3){target=Math.min(target,ah<6.5?0:3.5)}}
      if(player.mode==='walk'&&cur===OUT){const rx=player.x-v.x,rz=player.z-v.z;const ah=rx*sy+rz*cy;if(ah>.5&&ah<9&&Math.abs(rx*cy-rz*sy)<1.9)target=0}}
    if(v.speed<.3&&target===0){ai.stuck+=dt;if(ai.stuck>5){ai.ghost=2.5;ai.stuck=0}}else ai.stuck=0;
    v.speed+=Math.max(-9*dt,Math.min(4*dt,target-v.speed));
    v.x+=sy*v.speed*dt;v.z+=cy*v.speed*dt;v.g.position.set(v.x,0,v.z);v.g.rotation.y=v.yaw;
    v.head.material.opacity=ENV[envName].lamps>0?.8:0}
}

const NODES=[];XS.forEach((x,i)=>ZS.forEach((z,j)=>NODES.push({x,z,i,j})));
const nid=(i,j)=>i*ZS.length+j;

SEGS.forEach(([a,b])=>{const d=Math.hypot(NODES[a].x-NODES[b].x,NODES[a].z-NODES[b].z);D[a][b]=D[b][a]=d});
for(let k=0;k<NN;k++)for(let a=0;a<NN;a++)for(let b=0;b<NN;b++)if(D[a][k]+D[k][b]<D[a][b]){D[a][b]=D[a][k]+D[k][b];NX[a][b]=NX[a][k]}

  const x=A.x+dx*t,z=A.z+dz*t;const d=Math.hypot(px-x,pz-z);if(!best||d<best.d)best={x,z,d,s}}return best}
function pathNodes(a,b){const out=[a];while(a!==b){a=NX[a][b];out.push(a)}return out}
function route(px,pz,tx,tz){const ps=proj(px,pz),pt=proj(tx,tz);
  if(ps.s===pt.s)return[{x:ps.x,z:ps.z},{x:pt.x,z:pt.z}];
  let best=null;for(const a of ps.s)for(const b of pt.s){const d=Math.hypot(ps.x-NODES[a].x,ps.z-NODES[a].z)+D[a][b]+Math.hypot(pt.x-NODES[b].x,pt.z-NODES[b].z);if(!best||d<best.d)best={d,a,b}}

  const l=pts[pts.length-1];if(Math.hypot(l.x-pt.x,l.z-pt.z)>.5)pts.push({x:pt.x,z:pt.z});return pts}

function makeMarker(){const g=new THREE.Group();const cone=new THREE.Mesh(new THREE.ConeGeometry(.45,1,4),new THREE.MeshBasicMaterial({color:0xf6b43a}));cone.rotation.x=Math.PI;g.add(cone);
  const gl=glow(0xf6b43a,2.4,.6);g.add(gl);const ring=new THREE.Mesh(new THREE.RingGeometry(.9,1.15,32),new THREE.MeshBasicMaterial({color:0xf6b43a,transparent:true,opacity:.7,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;g.add(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.35,.6,60,12,1,true),new THREE.MeshBasicMaterial({color:0xf6b43a,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));beam.position.y=30;g.add(beam);g.userData={cone,gl,ring,beam};return g}
let mk=null,clock=0;
function updateMarker(dt){const t=objective.target;if(!mk)mk=makeMarker();
  if(!t||t.scene!==cur.name){if(mk.parent)mk.parent.remove(mk);$('#compass').style.opacity=0;return}
  if(mk.parent!==cur.s)cur.s.add(mk);const tx=typeof t.x==='function'?t.x():t.x,tz=typeof t.z==='function'?t.z():t.z;
  const hgt=t.h||2.6;mk.position.set(tx,0,tz);mk.userData.cone.position.y=hgt+Math.sin(clock*3)*.25;mk.userData.gl.position.y=hgt;mk.userData.ring.position.y=.07;mk.userData.ring.scale.setScalar(1+.15*Math.sin(clock*3));
  mk.visible=true;
  const dx=tx-player.x,dz=tz-player.z;const f={x:Math.sin(camYaw),z:Math.cos(camYaw)},r={x:-Math.cos(camYaw),z:Math.sin(camYaw)};
  const a=Math.atan2(dx*r.x+dz*r.z,dx*f.x+dz*f.z);$('#compass').style.opacity=1;$('#compass').style.transform=`rotate(${a}rad)`;
  const d=Math.hypot(dx,dz);$('#objT').textContent=objective.text+(d>6?` · ${Math.round(d)} מ׳`:'')}

let AC=null;function beep(f,d,type){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}

async function trainTicket(where){player.lock=true;const wi=WORLD.findIndex(c=>c.id===where);const all=WORLD.map((c,i)=>({n:c.n,sc:c.id,fare:14+Math.abs(i-wi)*2})).filter(d=>d.sc!==where);

function enterShop(id){if(!SCENES['shop_'+id])buildShopInterior(id);player.lock=true;fade(true).then(()=>{goScene('shop_'+id,0,3.4,Math.PI);CART=[];return fade(false)}).then(async()=>{player.lock=false;

  toast(STAFF[id]+': '+greet)})}
async function talkSeller(id){player.lock=true;const nm=STAFF[id];
  if(id==='bank'){await say(nm,'שלום, איך אפשר לעזור?');$('#ov').hidden=false;bankUI();return}
  if(MENUSHOP.includes(id)){await menuBuy(id,nm);return}
  if(!CART.length){const k=await say(nm,'שלום! קח מה שאתה רוצה מהמדפים ותביא לי לקופה.',['יש לך המלצה?','רק מסתכל, תודה']);
    if(k===0){const it=pick(ITEMS[id]);await say(nm,`האמת? ${it.n}. ₪${it.p} – הכי נמכר אצלנו השבוע.`)}player.lock=false;return}
  const sum=Math.round(CART.reduce((a,b)=>a+b.p,0)*PF());
  const k=await say(nm,`${CART.length} מוצרים: ${CART.map(i=>i.n).join(', ')}. סה״כ ₪${sum}. איך תשלם?`,['מזומן',G.bank.card?'כרטיס אשראי':'(אין לי כרטיס אשראי)','רגע, אני מחזיר הכל למדף']);
  if(k===2){CART=[];await say(nm,'אין בעיה.');player.lock=false;return}
  const how=k===0?'cash':'card';if(how==='card'&&!G.bank.card){await say(nm,'אין לך כרטיס? אפשר להוציא בבנק העיר.');player.lock=false;return}
  if(!await payPOS(sum,nm.split(' ')[0]?shopDef(id).n:'קנייה',how)){await say(nm,how==='cash'?'חסר לך כסף. אולי באשראי?':'העסקה לא אושרה. המסגרת מלאה.');player.lock=false;return}
  CART.forEach(applyItem);CART=[];giveBag();save();beep(880,.06);
  await say(nm,pick(['תודה רבה! הנה השקית שלך. יום טוב!','בבקשה, הכל בשקית. תהנה!','תתחדש! להתראות.']));player.lock=false}
async function menuBuy(id,nm){player.lock=true;const list=ITEMS[id];const k=await say(nm,'מה להביא לך?',[...list.map(i=>`${i.n} · ₪${i.p}`),'שום דבר, תודה']);if(k>=list.length){player.lock=false;return}
  const it=list[k];const how=G.money>=it.p?'cash':G.bank.card&&canCard(it.p)?'card':null;if(!await payPOS(Math.round(it.p*PF()),it.n,how||'cash')){await say(nm,'לא נורא, אולי בפעם אחרת.');player.lock=false;return}
  applyItem(it);hud();save();toast(`${it.n} · +${it.en||0} אנרגיה`,'good');await say(nm,pick(['בתיאבון!','בבקשה, תהנה.']));player.lock=false}
async function leaveShop(id){if(CART.length&&id!=='bank'){player.lock=true;await say(STAFF[id],'רגע! לא שילמת על זה. תחזיר למדף או תבוא לקופה.');CART=[];player.lock=false;return}
  const e=SHOPEXIT(id);player.lock=true;await fade(true);goScene(e.sc,e.x,e.z,e.yaw);await fade(false);player.lock=false}

function csTick(dt){if(!CS)return;CS.t+=dt;G.clockMin=(CS.kind==='super'?8*60:10*60)+CS.t/CS.dur*480;
  if(!CS.cust&&CS.t>=CS.next&&CS.t<CS.dur-6)csNew();
  if(CS.cust){CS.cust.wait+=dt;if(CS.cust.wait>40){CS.left++;toast('הלקוח התעצבן ויצא מהתור','bad');CS.cust=null;CS.next=CS.t+2;csRender()}}
  if(CS.t>=CS.dur&&!CS.cust){const S=CS;CS=null;$('#pc').hidden=true;const good=S.served>=8&&S.err<=2;
    endWork([['לקוחות ששירתת',S.served],['טעויות בעודף',S.err],['לקוחות שעזבו',S.left]],S.tips,good,good?'המנהלת: "קופה מהירה ומדויקת. כל הכבוד."':'המנהלת: "מחר לאט יותר עם העודף, ומהר יותר עם הסריקה."')}
  const tEl=document.getElementById('csClock');if(tEl){tEl.textContent=gameClock();document.getElementById('csWait').style.width=Math.max(0,100-(CS&&CS.cust?CS.cust.wait/40*100:0))+'%'}}
function csRender(){if(!CS)return;const c=CS.cust;const tot=c?c.items.reduce((a,b)=>a+b.p,0):0;let mid='';

  else if(c.stage==='pay')mid=`<div class="box"><h5>תשלום</h5>${c.paid?`<div style="font-size:16px">${esc(c.name)} נותן/ת שטר של <b>₪${c.paid}</b>. לגבות ₪${tot}. כמה עודף?</div>
     <div class="qr">${[1,2,5,10,20,50,100].map(v=>`<button data-chg="${v}" style="font-size:15px;padding:10px 14px">+₪${v}</button>`).join('')}<button data-cs="clr">נקה</button></div>

     :`<div style="font-size:16px">${esc(c.name)} משלם/ת באשראי.</div><button class="pbtn" data-cs="card" style="padding:12px">להעביר כרטיס · ₪${tot}</button>`}</div>`;
  $('#pc').innerHTML=`<div class="os" dir="rtl"><div class="banner">${CS.kind==='super'?'סופר השכונה · קופה 2':'גלידה של הים · דוכן'} · שירתת ${CS.served} לקוחות</div><div class="main" style="grid-template-columns:minmax(0,1fr)"><div class="pane">
    ${c?`<div class="box"><div class="cust"><div class="ava" style="background:${c.gen==='f'?'#db2777':'#1d4ed8'}">${c.name[0]}</div><div><b>${esc(c.name)}</b><div style="font-size:12.5px;color:#8fb0cc">סבלנות</div><div class="mood" style="width:180px"><i id="csWait" style="background:#22c55e;width:100%"></i></div></div></div></div>

let TAXI=null;
function taxiFare(d){return Math.round(12+Math.hypot(d.x-player.x,d.z-player.z)*.09)}
function callTaxi(dest){if(cur!==OUT||player.mode!=='walk')return;const pp=proj(player.x,player.z);const A=NODES[pp.s[0]],B=NODES[pp.s[1]];const L=Math.hypot(B.x-A.x,B.z-A.z),fx=(B.x-A.x)/L,fz=(B.z-A.z)/L;
  const v=vehicle('car',null,{body:0xfacc15,stripe:0x111111});const sg=sign(['מונית'],.9,.3,{bg:'#111',fg:'#facc15',size:110,w:256,h:86});sg.position.set(0,1.95,-.2);v.g.add(sg);const sg2=sg.clone();sg2.rotation.y=Math.PI;v.g.add(sg2);
  const tx=pp.x-fz*LANE,tz=pp.z+fx*LANE;v.x=tx-fx*55;v.z=tz-fz*55;v.yaw=Math.atan2(fx,fz);v.g.position.set(v.x,0,v.z);v.g.rotation.y=v.yaw;OUT.s.add(v.g);
  TAXI={v,dest,tx,tz,state:'coming',fare:taxiFare(dest)};toast('מונית בדרך אליך · '+TAXI.fare+' ₪')}
function updateTaxi(dt){if(!TAXI||TAXI.state!=='coming')return;const v=TAXI.v,dx=TAXI.tx-v.x,dz=TAXI.tz-v.z,d=Math.hypot(dx,dz);if(d<.4){TAXI.state='wait';beep(600,.1);setTimeout(()=>beep(600,.1),200);toast('המונית הגיעה. היכנס מהדלת האחורית.','good');return}
  const sp=Math.min(12,1+d*.5);v.x+=dx/d*sp*dt;v.z+=dz/d*sp*dt;v.g.position.set(v.x,0,v.z)}
async function boardTaxi(){const T=TAXI;player.lock=true;const k=await say('נהג המונית',`שלום! ל${T.dest.n}? זה יוצא ${T.fare} שקל.`,['יאללה, סע','לא תודה']);
  if(k===1){OUT.s.remove(T.v.g);TAXI=null;player.lock=false;return}
  if(!pay(T.fare,'מונית ל'+T.dest.n,G.money>=T.fare?'cash':'card')){await say('נהג המונית','אין לך מספיק כסף, אחי.');OUT.s.remove(T.v.g);TAXI=null;player.lock=false;return}

const TEXC={};

function lbl(text,bg,fg,sub){return ctexC('L|'+text+'|'+bg+'|'+(sub||''),256,256,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.22)';g.fillRect(0,h*.6,w,h*.1);
  g.fillStyle=fg;g.textAlign='center';g.direction='rtl';const fs=Math.min(70,Math.floor(w*1.7/Math.max(3,text.length)));g.font=`800 ${fs}px Assistant, sans-serif`;g.fillText(text,w/2,h*.44);
  if(sub){g.font=`700 ${Math.floor(fs*.62)}px Assistant, sans-serif`;g.fillText(sub,w/2,h*.86)}})}
function screenTex(kind){return ctexC('SCR|'+kind,256,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);const c={phone:['#4f46e5','#ec4899'],pro:['#0ea5e9','#22c55e'],tv:['#1e3a8a','#f59e0b'],lap:['#0f172a','#38bdf8']}[kind]||['#334155','#94a3b8'];gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.9)';g.font='700 44px "IBM Plex Mono",monospace';g.textAlign='center';if(kind==='tv'){g.beginPath();g.moveTo(0,h*.8);g.lineTo(w*.3,h*.45);g.lineTo(w*.55,h*.7);g.lineTo(w*.8,h*.35);g.lineTo(w,h*.6);g.lineTo(w,h);g.lineTo(0,h);g.fillStyle='rgba(0,0,0,.35)';g.fill();g.fillStyle='#fff';g.fillText('4K',w*.85,40)}else g.fillText('09:41',w/2,h*.35);
  if(kind==='phone'||kind==='pro'){for(let i=0;i<8;i++){g.fillStyle=['#fff','#fde68a','#a7f3d0','#bfdbfe'][i%4];g.globalAlpha=.85;g.fillRect(40+(i%4)*48,h*.5+Math.floor(i/4)*50,32,32)}g.globalAlpha=1}})}

  const quote=promo||(good?'שמעון: "משמרת מצוינת. הלקוחות מרוצים."':'שמעון: "יום קשה. מחר תעדף את פניות החירום."');
  hud();save();
  await payCard(`יום ${G.day} · ${G.role}`,[['פניות שנסגרו',S.closed],['דירוג ממוצע',avg?avg.toFixed(1)+'★':'—'],['תלונות לקוחות',S.expired],['שכר + בונוס',fmt(base)+' + '+fmt(bonus)],['בארנק',fmt(G.money)],['ימים מצוינים',G.goodDays]],quote);
  if(promo){const emp=SCENES.f4&&SCENES.f4.employee;}
  player.lock=false;
  const ov=$('#ov');ov.hidden=false;$('#sheet').innerHTML=`<span class="eyebrow">17:00</span><h2>מה עכשיו?</h2><p>אפשר להסתובב במגדל, או לנסוע הביתה ולהתחיל את היום הבא.</p><div class="btns"><button class="btn primary" id="home">הביתה · יום ${G.day+1}</button><button class="btn" id="stay">להסתובב במגדל</button></div>`;
  $('#home').addEventListener('click',async()=>{ov.hidden=true;await fade(true);G.day++;save();officeDay()});
  $('#stay').addEventListener('click',()=>{ov.hidden=true;setObj('חופשי · המעלית לוקחת לכל קומה',null)});
}

/* =============== TITLE =============== */
function title(){const s=loadSave();const ov=$('#ov');ov.hidden=false;
  $('#sheet').innerHTML=`<span class="eyebrow">משחק סיפור בתלת מימד</span><h1 class="title-h">מהרחוב <em>למשמרת</em></h1>
  <p>אלי ישן על ספסל ברחוב השוק. לילה אחד, אחרי מכות ולחם גנוב, מישהו מחברת החשמל מציע לו עבודה. מכאן מתחילים: עוזר טכנאי, ואן עבודה, ניווט ברחובות העיר, ובסוף שולחן במגדל בתל אביב ומסך מלא פניות.</p>
  <div class="keys">${touch?'<span>ג׳ויסטיק</span><span>ללכת ולנהוג</span><span>פעולה</span><span>לדבר, להיכנס, לתקן (להחזיק)</span>':'<kbd>W A S D</kbd><span>ללכת / לנהוג</span><kbd>Shift</kbd><span>לרוץ</span><kbd>E</kbd><span>לדבר, להיכנס לרכב, לתקן (להחזיק)</span><kbd>רווח</kbd><span>להמשיך דיאלוג</span>'}</div>
  <div class="btns">${s?`<button class="btn primary" id="cont">המשך · יום ${s.day}</button><button class="btn" id="new">משחק חדש</button>`:'<button class="btn primary" id="new">להתחיל</button>'}</div>`;
  const begin=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}};
  $('#new').addEventListener('click',async()=>{begin();ov.hidden=true;try{localStorage.removeItem('fts_save')}catch(e){}$('#fade').classList.add('on');await sleep(300);prologue()});
  const c=$('#cont');if(c)c.addEventListener('click',async()=>{begin();const d=JSON.parse(JSON.stringify(G));Object.assign(G,s);G.jobs=Object.assign(d.jobs,s.jobs||{});G.bank=Object.assign(d.bank,s.bank||{});G.look=Object.assign(d.look,s.look||{});G.tx=s.tx||[];if(s.v!==2){G.hasPhone=true}
    ov.hidden=true;$('#fade').classList.add('on');await sleep(300);startDay()});
  $('#sheet').querySelector('.btn.primary').focus()}

/* =============== LOOP =============== */
let last=performance.now(),hudT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(cur){
    if(!dialogOpen&&$('#ov').hidden&&$('#pc').hidden)updatePlayer(dt);
    updateNpcs(dt);updateInteract(dt);updateCamera(dt);updateMarker(dt);updateNav(dt);
    for(let i=waiters.length-1;i>=0;i--)if(waiters[i].fn()){const w=waiters.splice(i,1)[0];w.res()}
    if(cur===OUT)updateTraffic(dt);
    updateRide(dt);updateBusJob(dt);updateBusArrival(dt);updateCourier(dt);updateTaxi(dt);updateCity3(dt);updateV8(dt);if(POLICE){const on=Math.sin(clock*12)>0;POLICE.lb.material.opacity=on?.95:.1;POLICE.lr.material.opacity=on?.1:.95}uTimeC2.value+=dt;if(cur&&cur.land)cur.land.offset.x+=dt*.35;
    if(PC)updatePC(dt);else if(CC)ccTick(dt);else if(CS)csTick(dt);else if(WL)wlTick(dt);else if(G.stage!=='title'&&!dialogOpen&&$('#ov').hidden){const rate=G.stage==='life'?(G.workDone?1:.5):.35;G.clockMin+=dt*rate;
      if(G.stage==='life'){G.energy=Math.max(0,G.energy-dt*rate*5/60);
        const m=G.clockMin%1440,want=m<390?'night':m<480?'dawn':m<1020?'morning':m<1170?'evening':'night';if(want!==envName){envName=want;applyEnv()}
        if(G.workDone&&G.clockMin>=25*60&&!player.lock)sleepNow(true)}}
    hudT+=dt;if(hudT>.25){hudT=0;hud()}
    renderFrame()}
  requestAnimationFrame(frame)}

async function boot(){
  try{await Promise.race([document.fonts.load('800 40px Assistant'),sleep(1800)])}catch(e){}
  makeFacades();buildOutdoor();buildLobby();buildApartment();for(let n=1;n<=4;n++)buildFloor(n);
  spawnTraffic(touch?16:24);spawnWalkers(touch?10:16);addShopInters();addTransitInters();addCourierInters();addTaxiInters();makePolice();initV8();
  addInter({scene:'out',x:0,z:-68.6,r:3,mode:'walk',label:'להיכנס לגלובל-נט',when:()=>G.stage==='life',act:async()=>{player.lock=true;await fade(true);if(!SCENES.netco)buildNetco();goScene('netco',0,9.5,Math.PI);await fade(false);player.lock=false;if(G.job==='internet'&&!G.workDone)setObj('גש לעמדה שלך',{scene:'netco',x:8.5,z:4.9,h:2.2})}});
  try{if(window.claude&&claude.use)claude.use('sample').then(s=>{SAMPLE=s||null}).catch(()=>{})}catch(e){}
  setOutfit('homeless');goScene('out',P.bench.x+.8,P.bench.z-.4,0);envName='night';applyEnv();resize();hud();renderPhone();
  requestAnimationFrame(frame);title()}
function showErr(e){$('#ov').hidden=false;$('#sheet').innerHTML=`<span class="eyebrow">שגיאה</span><h2>משהו נשבר בטעינה</h2><p>שלח לי את השורה הזו ואתקן:</p><p style="font-family:var(--f-mono);font-size:13px;direction:ltr;text-align:left">${esc(String(e&&e.stack||e)).slice(0,500)}</p>`}
let BOOTED=false;function softErr(e){const m=String(e&&e.message||e||'');if(!m||/ResizeObserver|Script error/i.test(m))return;console.error(e);if(!BOOTED){showErr(e);return}try{toast('תקלה קטנה: '+m.slice(0,80),'bad')}catch(_){}}
addEventListener('error',ev=>softErr(ev.error||ev.message));
addEventListener('unhandledrejection',ev=>softErr(ev.reason));
boot().then(()=>{BOOTED=true}).catch(showErr);
})();
</script>
